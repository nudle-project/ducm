<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duckcial Media | Account analytics</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --primary: #15803d;
        --soft: #ecfdf5;
        --border: #e5e7eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(140deg, #f3f7f5, #f5f5f4 55%, #edf3ee);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(1050px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 3rem; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
      .eyebrow { margin: 0 0 0.4rem; color: var(--primary); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; }
      h1 { margin: 0; font-size: 2rem; }
      .back-link { padding: 0.7rem 0.9rem; color: var(--text); background: white; border: 1px solid var(--border); border-radius: 9px; text-decoration: none; font-weight: 700; }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
      .metric { padding: 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
      .metric span { display: block; color: var(--muted); font-size: 0.8rem; }
      .metric strong { display: block; margin-top: 0.3rem; font-size: 1.6rem; }
      section { margin-top: 1.5rem; }
      h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
      .post-list { display: grid; gap: 0.5rem; }
      .post-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(60px, auto)); gap: 1rem; align-items: center; padding: 0.9rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); }
      .post-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
      .post-type { display: inline-block; margin-left: 0.5rem; padding: 0.2rem 0.4rem; border-radius: 5px; background: var(--soft); color: var(--primary); font-size: 0.7rem; text-transform: uppercase; }
      .post-stat { color: var(--muted); font-size: 0.85rem; text-align: right; }
      .status { padding: 1rem; color: var(--muted); background: white; border: 1px dashed var(--border); border-radius: 10px; }
      @media (max-width: 650px) {
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .post-row { grid-template-columns: minmax(0, 1fr) repeat(2, auto); gap: 0.5rem; }
        .post-row .post-stat:last-child { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Duckcial Media</p>
          <h1>Account analytics</h1>
        </div>
        <a class="back-link" href="./index.html">Back to feed</a>
      </header>
      <div class="metrics" aria-live="polite">
        <div class="metric"><span>Stories</span><strong id="storyCount">0</strong></div>
        <div class="metric"><span>Total views</span><strong id="viewCount">0</strong></div>
        <div class="metric"><span>Likes</span><strong id="likeCount">0</strong></div>
        <div class="metric"><span>Engagement rate</span><strong id="engagementRate">0%</strong></div>
      </div>
      <section>
        <h2>Top stories</h2>
        <div id="postList" class="post-list"><p class="status">Loading analytics...</p></div>
      </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      const currentUser = JSON.parse(getCookie('duckcialCurrentUser') || '{}');
      if (!currentUser.email) {
        window.location.replace('../loggedout/login.html');
      }

      function getPosts() {
        try {
          const parsed = JSON.parse(getCookie('duckcialSharedPosts') || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function renderAnalytics(posts) {
        const ownPosts = posts.filter((post) => {
          return (post.authorId && post.authorId === currentUser.id) ||
            (post.authorEmail && post.authorEmail.toLowerCase() === currentUser.email.toLowerCase());
        });
        const views = ownPosts.reduce((sum, post) => sum + Number(post.views || 0), 0);
        const likes = ownPosts.reduce((sum, post) => sum + Number(post.likes || 0), 0);
        const dislikes = ownPosts.reduce((sum, post) => sum + Number(post.dislikes || 0), 0);
        const comments = ownPosts.reduce((sum, post) => sum + (Array.isArray(post.comments) ? post.comments.length : 0), 0);
        const interactions = likes + dislikes + comments;
        const rate = views ? Math.round((interactions / views) * 100) : 0;

        document.getElementById('storyCount').textContent = formatNumber(ownPosts.length);
        document.getElementById('viewCount').textContent = formatNumber(views);
        document.getElementById('likeCount').textContent = formatNumber(likes);
        document.getElementById('engagementRate').textContent = `${rate}%`;

        const list = document.getElementById('postList');
        list.innerHTML = '';
        if (!ownPosts.length) {
          list.innerHTML = '<p class="status">No stories to analyze yet.</p>';
          return;
        }

        ownPosts.sort((a, b) => Number(b.likes || 0) - Number(a.likes || 0));
        ownPosts.slice(0, 10).forEach((post) => {
          const row = document.createElement('div');
          row.className = 'post-row';
          const title = document.createElement('div');
          title.className = 'post-title';
          title.textContent = post.name || 'Untitled story';
          const type = document.createElement('span');
          type.className = 'post-type';
          type.textContent = post.type || 'media';
          title.appendChild(type);
          row.appendChild(title);
          [[post.views, 'views'], [post.likes, 'likes'], [post.dislikes, 'dislikes']].forEach(([value, label]) => {
            const stat = document.createElement('span');
            stat.className = 'post-stat';
            stat.textContent = `${formatNumber(value)} ${label}`;
            row.appendChild(stat);
          });
          list.appendChild(row);
        });
      }

      async function loadAnalytics() {
        let posts = getPosts();
        const firebaseState = window.DuckcialFirebase;
        if (firebaseState && firebaseState.ready && firebaseState.db) {
          try {
            const snapshot = await firebaseState.db.collection('meta').doc('feed').get();
            if (snapshot.exists && Array.isArray(snapshot.data().posts)) {
              posts = snapshot.data().posts;
              document.cookie = `duckcialSharedPosts=${encodeURIComponent(JSON.stringify(posts))}; path=/; max-age=31536000; SameSite=Lax`;
            }
          } catch (error) {
            document.getElementById('postList').innerHTML = '<p class="status">Could not load online analytics. Showing saved data.</p>';
          }
        }
        renderAnalytics(posts);
      }

      loadAnalytics();
    </script>
  </body>
</html>
