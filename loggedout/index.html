<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duckcial Media | Welcome</title>
    <style>
      :root {
        --bg: #f3f5f2;
        --panel: #ffffff;
        --text: #17211b;
        --muted: #65736a;
        --primary: #168144;
        --primary-dark: #116737;
        --border: #dce5de;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        background: repeating-linear-gradient(135deg, #f3f5f2 0 24px, #eef2ed 24px 25px);
      }
      main {
        width: min(460px, 100%);
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.5rem;
        color: var(--primary-dark);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #dff3e5;
      }
      h1 { margin: 0 0 0.7rem; font-size: 2.2rem; line-height: 1.05; }
      p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.55; }
      nav { display: grid; gap: 0.65rem; }
      a {
        display: block;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        text-align: center;
        text-decoration: none;
        font-weight: 700;
      }
      a.primary { color: white; background: var(--primary); border-color: var(--primary); }
      a.primary:hover { background: var(--primary-dark); }
      a:hover { border-color: var(--primary); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true">D</span> Duckcial Media</div>
      <h1>Build your audience</h1>
      <p>Sign in or create a profile to share your 9:16 stories. You can also browse the feed without an account.</p>
      <nav aria-label="Account options">
        <a class="primary" href="./login.html">Log in</a>
        <a href="./signup.html">Sign up</a>
        <a href="../loggedin/index.html?guest=1">Use without an account</a>
      </nav>
    </main>
  </body>
</html>
