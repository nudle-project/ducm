<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duckcial Media | Welcome</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --muted: #6b7280;
        --primary: #16a34a;
        --primary-dark: #15803d;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
      }

      .auth-card {
        width: min(440px, calc(100% - 2rem));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 2.5rem 2rem;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 1rem;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        background: #ecfdf5;
        color: var(--primary-dark);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(2rem, 4vw, 2.75rem);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 0.95rem 1.2rem;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: var(--primary);
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button.secondary {
        background: #111827;
      }

      button:hover {
        opacity: 0.96;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="eyebrow">Duckcial Media</div>
      <h1>Build your audience</h1>
      <p>
        Sign in to your account or create a new profile to start sharing your 9:16 content.
      </p>
      <div class="btn-row">
        <button id="loginButton" type="button">Log in</button>
        <button id="signupButton" class="secondary" type="button">Sign up</button>
      </div>
    </div>

    <script>
      document.getElementById('loginButton').addEventListener('click', () => {
        window.location.href = './login.html';
      });

      document.getElementById('signupButton').addEventListener('click', () => {
        window.location.href = './signup.html';
      });
    </script>
  </body>
</html>
